[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/jgenesis-pce", "vendor/dez80", "vendor/jgenesis", "vendor/mizu/mizu-core", "vendor/mizu/save_state", "vendor/mizu/save_state_derive"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
